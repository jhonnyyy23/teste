# Baixa os enigmas do dia e publica o site no GitHub Pages.
# Roda todo dia às 13:10 UTC (10:10 em Brasília), a cada alteração no repositório
# e quando você clica em "Run workflow" na aba Actions.
name: Atualizar e publicar

on:
  schedule:
    - cron: '10 13 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar enigmas
        shell: powershell
        run: .\atualizar.ps1

      - name: Salvar no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || git commit -m "Enigmas de $(date -u +%F)"
          git push

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
