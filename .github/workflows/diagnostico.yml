# Temporário: testa se os servidores do GitHub conseguem baixar do puzzleship.
name: Diagnostico
on:
  push:
    paths: ['.github/workflows/diagnostico.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: |
          D=$(date -u +%F)
          for u in "https://www.puzzleship.com/logic/einstein-riddles/p/$D" "https://www.puzzleship.com/logic/einstein-riddles"; do
            curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36" -o page.html -w "linux curl $u -> HTTP %{http_code}, %{size_download} bytes\n" "$u" >> diag.txt
            echo "  contem pack: $(grep -c 'dateSlug' page.html)  titulo: $(grep -o '<title>[^<]*' page.html | head -1)" >> diag.txt
          done
          cat diag.txt
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: diag.txt }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $d = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          try { $r = Invoke-WebRequest -UseBasicParsing "https://www.puzzleship.com/logic/einstein-riddles/p/$d"; "windows iwr -> HTTP $($r.StatusCode), $($r.RawContentLength) bytes" | Out-File diag.txt }
          catch { "windows iwr -> ERRO: $($_.Exception.Message)" | Out-File diag.txt }
          .\atualizar.ps1 -Data $d -Saida "$env:TEMP\t" *>&1 | Out-File -Append diag.txt
          Get-Content diag.txt
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: diag.txt }
  salvar:
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - run: |
          { echo "== LINUX"; cat linux/diag.txt; echo "== WINDOWS"; cat windows/diag.txt; } > diagnostico.txt
          git config user.name "github-actions[bot]"; git config user.email "41898213+github-actions[bot]@users.noreply.github.com"
          git add diagnostico.txt; git commit -m "Resultado do diagnóstico"; git push
